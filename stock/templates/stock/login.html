<!DOCTYPE html>
{% load static %}
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — MLC Technologie</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Barlow:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--sidebar-bg);
            position: relative;
            overflow: hidden;
        }
        /* Cercles décoratifs */
        body::before {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(26,122,46,.15), transparent);
            top: -100px; right: -100px;
            border-radius: 50%;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(232,82,10,.1), transparent);
            bottom: -100px; left: -100px;
            border-radius: 50%;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            padding: 48px 44px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 80px rgba(0,0,0,.25);
            position: relative;
            z-index: 1;
            animation: fadeUp .4s ease;
        }
        @keyframes fadeUp {
            from { transform: translateY(30px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo-icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff;
            margin: 0 auto 16px;
            box-shadow: 0 8px 24px rgba(26,122,46,.35);
        }
        .login-title {
            font-family: 'Barlow', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--navy);
        }
        .login-title span { color: var(--accent); }
        .login-sub {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 4px;
        }
        .login-form-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 20px;
        }
        .input-icon {
            position: relative;
        }
        .input-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 14px;
        }
        .input-icon input {
            padding-left: 42px !important;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), #145f24);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            transition: all .2s;
            box-shadow: 0 4px 16px rgba(26,122,46,.35);
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26,122,46,.4);
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-light);
        }
        .alert-login {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

<div class="login-card">

    <!-- Logo -->
     <div class="login-logo">

<!-- Par -->
<div class="login-logo-icon" style="background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.15);">
    <img src="{% static 'img/logo_mlc.jpeg' %}"
         alt="MLC Logo"
         style="width:64px;height:64px;object-fit:contain;border-radius:14px;">
</div>
<div class="login-title"><span>MLC</span> Technologie</div>
        <div class="login-sub">Technologies Rim • Gestion de stock</div>
    </div>

    <!-- Erreurs -->
    {% if messages %}
    {% for message in messages %}
    <div class="alert-login">
        <i class="fas fa-exclamation-circle"></i>
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}

    <!-- Formulaire -->
    <div class="login-form-title">Connectez-vous à votre espace</div>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">Identifiant</label>
            <div class="input-icon">
                <i class="fas fa-user"></i>
                <input type="text" name="username" class="form-control"
                       placeholder="Votre identifiant" required autofocus>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Mot de passe</label>
            <div class="input-icon">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" id="password" class="form-control"
                       placeholder="Votre mot de passe" required>
                <i class="fas fa-eye" id="togglePwd"
                   style="left:auto;right:14px;cursor:pointer;"
                   onclick="togglePassword()"></i>
            </div>
        </div>
        <button type="submit" class="btn-login">
            <i class="fas fa-sign-in-alt"></i> Se connecter
        </button>
    </form>

    <div class="login-footer">
        <i class="fas fa-shield-alt" style="color:var(--primary)"></i>
        MLC Technologie Rim • +222 49 71 79 05
    </div>

</div>

<script>
function togglePassword() {
    const pwd = document.getElementById('password');
    const icon = document.getElementById('togglePwd');
    if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        pwd.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}
</script>
</body>
</html>
